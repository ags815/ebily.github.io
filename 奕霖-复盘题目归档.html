括是否贴合文本，不从诗人名气套结论。", "answer": "不赞同。“丹心苦”“白发”呈现忧愁与衰老感；“干戈满地”联系战乱背景，“休照国西营”寄托对征战将士的关切。整体更宜理解为忧时伤乱、沉郁悲苦，不能仅因有战争词语就归为雄浑壮阔。其他有文本依据的表达也可。", "checkpoints": ["明确判断，并指出“雄浑壮阔”与文本情感不贴合", "至少引用两处词句或注释，解释它们如何支撑情感判断"], "minutes": 5, "status": "active", "answerBasis": "按已核对题干独立整理的参考思路，非已取得的教师标准答案", "createdAt": "2026-10-20"}, {"id": "review-math-20261015-reflection-original", "revision": 1, "subject": "数学", "title": "光线反射：先确定直线经过的点", "sourceExamId": "a-20261015-math", "sourceQuestionIds": ["a-20261015-math:q11"], "kind": "原题重做", "material": "一束光线从点(2,3)射出，经x轴反射后，反射光线所在直线与2x＋4y－3＝0垂直。", "prompt": "求反射光线所在直线的方程。先画图并标出发光点关于x轴的对称点，再写出斜率及方程。", "hint": "把反射前的光路关于x轴对称：反射线经过发光点的对称点(2,−3)，不要求经过原发光点。", "answer": "已知直线斜率为−1/2，故反射线斜率为2。发光点关于x轴的对称点为(2,−3)，反射线过此点，所以y＋3＝2(x−2)，即2x−y−7＝0。反射点是(7/2,0)，可用作检查。", "checkpoints": ["标出对称点(2,−3)", "由垂直关系得到斜率2", "列出并化为2x−y−7＝0，检查代入成立"], "minutes": 5, "status": "active", "answerBasis": "按已核对题干独立整理的参考思路，非已取得的教师标准答案", "createdAt": "2026-10-20"}, {"id": "review-history-20260922-document", "revision": 1, "subject": "历史", "title": "材料辨析：哪一结论最有证据？", "sourceExamId": "a-20260922-history", "sourceQuestionIds": ["a-20260922-history:q4"], "kind": "原题改编", "material": "原题引用《睡虎地秦墓竹简》。按原题内容整理为：\n①事务请示须用书面，不得口头请示或托人口头请示。\n②文书传送区分急件等情况，并规定时限，不得滞留。\n③伪造文书受到处罚。", "prompt": "哪一结论最受材料直接支持？\nA. 文书管理有制度性规范\nB. 所有官员都严格守法\nC. 全国百姓都能书面参政\nD. 后世制度完全照搬秦朝\n选出一项，并写两条材料依据。", "hint": "先逐项问：材料有没有写到“所有官员”“全国百姓”或“后世”？区分制度规定与实际执行结果。", "answer": "选A。书面请示、传送时限和伪造处罚说明管理有相应规则。可从中任选两条作为依据。材料有处罚规定，不代表所有人都遵守；也没有给出百姓参政或后世制度的信息。", "checkpoints": ["选择A", "至少把两条具体规定对应到“制度规范”", "不把制度要求直接写成普遍执行结果"], "minutes": 5, "status": "active", "answerBasis": "按已核对题干独立整理的参考思路，非已取得的教师标准答案", "createdAt": "2026-10-20"}, {"id": "review-cn-20261016-vocabulary", "revision": 1, "subject": "语文", "title": "文言词义：把字放回句子", "sourceExamId": "a-20261016-chinese", "sourceQuestionIds": ["a-20261016-chinese:q6"], "kind": "原题改编", "material": "①今人乍见孺子将入于井。\n②恻隐之心，仁之端也。\n两句均出自本次早读练习所涉《孟子》材料。", "prompt": "分别解释“乍”和“端”。“乍”在这里解释成“刚刚”是否准确？请把第①句译成现代汉语，检查句意。", "hint": "第①句说的是突然看见一个孩子将要掉进井里的情境；第②句谈一种品德的发端。", "answer": "“乍”是突然；“端”是开端、萌芽。第①句可译为：假如现在有人突然看见一个小孩将要掉进井里。“刚刚”侧重事情发生不久，不能准确表达这里突然遇见该情境的意思。译法可不同，关键词和句意应准确。", "checkpoints": ["“乍”解释为突然", "“端”解释为开端或萌芽", "译文保留“将要”和突然看到的情境"], "minutes": 5, "status": "active", "answerBasis": "按已核对题干独立整理的参考思路，非已取得的教师标准答案", "createdAt": "2026-10-20"}, {"id": "review-math-20261015-reflection-transfer", "revision": 1, "subject": "数学", "title": "同方法变式：换一个发光点", "sourceExamId": "a-20261015-math", "sourceQuestionIds": ["a-20261015-math:q11"], "kind": "自编变式", "material": "这是依据第11题方法自编的变式，不是原卷试题。\n光线从点(1,2)射出，经x轴反射后，反射线与直线x＋y＝0垂直。", "prompt": "求反射光线所在直线的方程，并写出它与x轴的交点。最后用一句话说明为什么不能直接用原发光点列反射线。", "hint": "先求点(1,2)关于x轴的对称点，再求与斜率−1垂直的直线斜率。", "answer": "对称点为(1,−2)，反射线斜率为1，故y＋2＝x−1，即x−y−3＝0；与x轴交于(3,0)。把入射路径关于x轴对称后，它与反射路径共线，所以反射线用对称点确定，不能直接要求反射线经过原发光点。", "checkpoints": ["对称点(1,−2)和斜率1", "方程x−y−3＝0，反射点(3,0)", "能解释选对称点的原因，而非只背结论"], "minutes": 5, "status": "active", "answerBasis": "按已核对题干独立整理的参考思路，非已取得的教师标准答案", "createdAt": "2026-10-20"}, {"id": "review-history-20260922-government", "revision": 1, "subject": "历史", "title": "从材料措辞区分“作风”与“组织”", "sourceExamId": "a-20260922-history", "sourceQuestionIds": ["a-20260922-history:q9"], "kind": "原题改编", "material": "原题介绍中华苏维埃共和国临时政府的办公情形。按原文整理：办公室由木板隔成，每间十几平方米，陈设简单；每个部只设部长1名，没有部长时才设副部长1名；财政部开始时只有一两人。", "prompt": "如果要判断其“机构与人员设置”的特点，你会用“精简”还是只用“艰苦朴素”来回答？请指出两条最直接的证据，并区分两类证据各说明什么。", "hint": "房间和家具主要说明办公条件；领导职数和人员数目更直接说明组织设置。", "answer": "回答机构与人员设置，应着重“精简”。“每部只设部长1名，没有部长才设副部长1名”“财政部开始只有一两人”是直接依据。房间小、家具简单可说明条件简朴，但不能替代人员与机构的证据。仅凭材料还不足以测量实际行政效率，不能把“精简”直接等同于已证实的高效。", "checkpoints": ["围绕问题选“精简”", "引用职数和人数两条证据", "区分办公条件、组织设置与实际效率"], "minutes": 5, "status": "active", "answerBasis": "按已核对题干独立整理的参考思路，非已取得的教师标准答案", "createdAt": "2026-10-20"}, {"id": "review-cn-20261022-shi", "revision": 1, "subject": "语文", "title": "同一个“事”，在两句中做什么？", "sourceExamId": "a-20261022-chinese", "sourceQuestionIds": ["a-20261022-chinese:q3"], "kind": "原题改编", "material": "①回虽不敏，请事斯语矣。\n②苟不充之，不足以事父母。", "prompt": "分别解释两句中的“事”，再用现代汉语转述第①句。“事”在这两处是否是虚词？", "hint": "看“事”后面接的是“斯语”还是“父母”，判断所实施的具体行为。", "answer": "①“事”是实践、践行；②“事”是侍奉。①可译为：我虽然不聪敏，请让我践行这番话吧。两处都是有实在词义的动词，不是因为同一个字出现在句中就属于虚词。", "checkpoints": ["解释两处不同词义", "译文体现“践行这番话”", "据句法与词义判断为实词"], "minutes": 4, "status": "active", "answerBasis": "依据本次可见题干与判分独立整理，未取得老师标准解析；参考思路不作自动评分依据", "createdAt": "2026-10-25"}, {"id": "review-en-20261022-preposition", "revision": 1, "subject": "英语", "title": "先读意思，再填介词", "sourceExamId": "a-20261022-english", "sourceQuestionIds": ["a-20261022-english:q38"], "kind": "原题重做", "material": "A university education improves your job prospects and broadens your future options. Increasingly, you're at a disadvantage ____ a degree.", "prompt": "填入一个合适的介词，并用中文解释第二句。你原来写的of是否符合上下文的意思？", "hint": "前句说学位带来的有利条件；后句描述缺少这个条件时的劣势。", "answer": "参考填without。句意是“没有学位，你越来越处于不利地位”。at a disadvantage是固定搭配；不能因为看见disadvantage就机械接of，要先确认介词所表达的逻辑。这里是在理解文章观点，不是在判断所有人的升学选择。", "checkpoints": ["用without表达没有", "说明上下文的优势/劣势关系", "把整个短语放回句子核验"], "minutes": 4, "status": "active", "answerBasis": "依据本次可见题干与判分独立整理，未取得老师标准解析；参考思路不作自动评分依据", "createdAt": "2026-10-25"}, {"id": "review-cn-20261022-zei", "revision": 1, "subject": "语文", "title": "“贼”是指人，还是一种行为？", "sourceExamId": "a-20261022-chinese", "sourceQuestionIds": ["a-20261022-chinese:q7"], "kind": "原题改编", "material": "①故贼人以利其身。\n②有是四端而自谓不能者，自贼者也。", "prompt": "分别解释两句中的“贼”，判断词义是否相同。用一句话说明你如何从宾语和上下文判断，而不是直接套“盗贼”。", "hint": "“贼人”与“自贼”中，动作作用于别人还是自己？", "answer": "两句“贼”都可解释为损害、伤害。①是损害别人而使自己获利；②是自己伤害、妨害自己。句中用法是行为，不是指身份为盗贼的人。理解一词多义时先看语境和词语间关系。", "checkpoints": ["两句均解释为损害/伤害", "区分损害他人与损害自己", "不把字面常见名词义直接套入"], "minutes": 4, "status": "active", "answerBasis": "依据本次可见题干与判分独立整理，未取得老师标准解析；参考思路不作自动评分依据", "createdAt": "2026-10-25"}, {"id": "review-en-20261022-participle", "revision": 1, "subject": "英语", "title": "句子已有谓语，burden还要怎样变？", "sourceExamId": "a-20261022-english", "sourceQuestionIds": ["a-20261022-english:q42"], "kind": "原题重做", "material": "Many students leave university ____ (burden) with debt, and with no guarantee of a decent job.", "prompt": "填出burden的适当形式，并写出本句已有的谓语。“students”与“burden”是什么关系？", "hint": "先找leave；再判断学生是背负债务的状态，还是正在主动让别人负担债务。", "answer": "参考填burdened。已有谓语leave；burdened with debt表示学生被债务所累的状态，students与burden之间为被动关系。原填burdenly不能作为这里合适的结构。", "checkpoints": ["识别谓语leave", "填burdened", "解释被动/状态关系，而不是只背后缀"], "minutes": 4, "status": "active", "answerBasis": "依据本次可见题干与判分独立整理，未取得老师标准解析；参考思路不作自动评分依据", "createdAt": "2026-10-25"}, {"id": "review-en-20261022-word-direction", "revision": 1, "subject": "英语", "title": "词形正确之前，先检查意思方向", "sourceExamId": "a-20261022-english", "sourceQuestionIds": ["a-20261022-english:q40"], "kind": "原题重做", "material": "And a degree opens up job opportunities abroad as well — when you're a graduate, you have ____ (limit) chances!", "prompt": "结合这一段在说明高等教育的好处，填出limit的适当形式。limited与unlimited会让句意怎样变化？", "hint": "对照opens up job opportunities与本段在谈的benefits，不只判断空后chances是名词。", "answer": "按该段表达的积极意义，参考填unlimited，表示机会很多、广阔；limited表示有限，会改变原段想强调的方向。这里先练文章语义，再核对词形；不把原文修辞当成现实中机会无限的保证。", "checkpoints": ["比较limited与unlimited的语义方向", "以本段上下文为依据", "把词放回原句检查"], "minutes": 4, "status": "active", "answerBasis": "依据本次可见题干与判分独立整理，未取得老师标准解析；参考思路不作自动评分依据", "createdAt": "2026-10-25"}, {"id": "review-en-20261022-clause", "revision": 1, "subject": "英语", "title": "给句子找齐“冠词—关系词—谓语”", "sourceExamId": "a-20261022-english", "sourceQuestionIds": ["a-20261022-english:q43", "a-20261022-english:q44", "a-20261022-english:q45"], "kind": "原题改编", "material": "Others argue that many employers appear to value work experience over ____ degree.\nI make a point of interviewing people first ____ have spent their time travelling or working instead of doing a degree, because this shows they ____ (prepare) to stand out from the crowd.", "prompt": "依次完成三空，并分别指出：泛指还是特指？关系词在从句中作什么成分？they后需要谓语还是孤立分词？", "hint": "degree为单数可数名词；先行词people指人，have spent前缺主语；because后也要有完整句子。", "answer": "参考：a；who（或that）；are prepared。首次泛指一种学位用a；who/that指代people，在定语从句中作主语；are prepared to…构成完整谓语，表达做好准备/愿意。最后一空按语境整理为该参考表达，具体判分与可接受时态需以老师解析为准，不能据原填preparing直接泛化为所有从句都不会。", "checkpoints": ["a用于单数可数名词的泛指", "who/that作定语从句主语", "补齐谓语，不只填preparing"], "minutes": 4, "status": "active", "answerBasis": "依据本次可见题干与判分独立整理，未取得老师标准解析；参考思路不作自动评分依据", "createdAt": "2026-10-25"}, {"id": "review-en-20261022-reading-services", "revision": 1, "subject": "英语", "title": "从投递方式找“如何进行实验”", "sourceExamId": "a-20261022-english", "sourceQuestionIds": ["a-20261022-english:q5"], "kind": "原题改编", "material": "Thanks to two digital services that deliver poetry right to my email inbox, it's been an easy resolution to keep.", "prompt": "据这句，作者如何维持每日读诗的实验？\nA. By listening to radio and writing emails.\nB. By contributing poems to a newspaper.\nC. By creating resolutions over breakfast.\nD. By making use of online services.\n选一项并指出原句中可对应的词语。", "hint": "题目问“如何做”，找具体实现方式；digital services与online services是什么关系？", "answer": "选D。two digital services…deliver poetry…to my email inbox说明借助线上投递服务。B是给报纸投稿，原文没有说作者靠投稿维持这个实验；不能因文章出现报纸就选B。", "checkpoints": ["选择D", "对应digital services和online services", "用具体行为排除“给报纸投稿”"], "minutes": 4, "status": "active", "answerBasis": "依据本次可见题干与判分独立整理，未取得老师标准解析；参考思路不作自动评分依据", "createdAt": "2026-10-25"}], "batches": [{"id": "review-batch-20261020", "title": "近期测验 · 综合复盘", "date": "2026-10-20", "questionIds": ["review-cn-20260930-poetry-context", "review-math-20261015-reflection-original", "review-history-20260922-document", "review-cn-20261016-vocabulary", "review-math-20261015-reflection-transfer", "review-history-20260922-government"], "subjectNotes": {"英语": "本次只有答题卡和得分，缺少阅读语篇、语法填空原句及标准答案。先等原题，不据错题号编造题目。", "政治": "本次没有新的政治试卷、题干或作答材料，暂不出本次测验的巩固题。", "地理": "本次没有新的地理试卷、题干或作答材料，暂不出本次测验的巩固题。"}, "note": "本次将9月22日历史、9月30日及10月16日语文、10月15日数学的可用材料整理为两轮；每轮每科最多一题。数学第13题已满分，不纳入纠错。"}, {"id": "review-batch-20261025", "title": "10月下旬 · 英语与语文巩固", "date": "2026-10-25", "questionIds": ["review-cn-20261022-shi", "review-en-20261022-preposition", "review-cn-20261022-zei", "review-en-20261022-participle", "review-en-20261022-word-direction", "review-en-20261022-clause", "review-en-20261022-reading-services"], "subjectNotes": {"数学": "本周没有新的数学材料；第13题仍为满分12/12。需要时可切换上一批次回顾第11题。", "历史": "本周没有新的历史试卷；上一批次的历史题仍在归档中。", "政治": "未取得新的政治试卷及具体作答，本次不强行出题。", "地理": "未取得新的地理试卷及具体作答，本次不强行出题。"}, "note": "本次2道语文、5道英语复盘题，分5轮，每轮每科至多一题；语文第1题全班得分率0%，先待老师讲评，不强行编入纠错。"}]}}</script><script>const DATA=JSON.parse(document.getElementById('public-data').textContent);
const $=id=>document.getElementById(id);
const assessments=DATA.assessments;
const names=DATA.subjects.map(s=>s.name);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
'use strict';
const ReviewCore=(()=>{
 const results=['independent','with-help','needs-help'];
 function buildRounds(bank,batch,subjects){
  const byId=new Map(bank.items.map(q=>[q.id,q]));
  const queues=subjects.map(s=>batch.questionIds.map(id=>byId.get(id)).filter(q=>q&&q.status==='active'&&q.subject===s));
  return Array.from({length:Math.max(0,...queues.map(q=>q.length))},(_,i)=>queues.map(q=>q[i]).filter(Boolean));
 }
 function done(q,state){const r=state.items?.[q.id];return Boolean(r&&r.revision===q.revision&&r.completedAt&&['independent','with-help'].includes(r.result));}
 function accessible(rounds,state){for(let i=0;i<rounds.length;i++)if(!rounds[i].every(q=>done(q,state)))return i;return Math.max(0,rounds.length-1);}
 function summary(rounds,state){const questions=rounds.flat(),completed=questions.filter(q=>done(q,state)).length;return {total:questions.length,completed,allDone:questions.length>0&&completed===questions.length};}
 function normalize(raw,bank){
  if(!raw||raw.schemaVersion!==1||typeof raw.items!=='object'||raw.items===null)throw Error('不是有效的复盘进度文件');
  const state={schemaVersion:1,items:{},batches:{}};
  for(const q of bank.items){const r=raw.items[q.id];if(!r||r.revision!==q.revision)continue;const result=results.includes(r.result)?r.result:'';state.items[q.id]={revision:q.revision,answer:typeof r.answer==='string'?r.answer.slice(0,5000):'',result,completedAt:['independent','with-help'].includes(result)&&typeof r.completedAt==='string'?r.completedAt:null,updatedAt:typeof r.updatedAt==='string'?r.updatedAt:null};}
  for(const b of bank.batches){const c=raw.batches?.[b.id]?.currentRound;state.batches[b.id]={currentRound:Number.isInteger(c)&&c>=0?c:0};}
  return state;
 }
 return {buildRounds,done,accessible,summary,normalize};
})();
if(typeof module!=='undefined'&&module.exports)module.exports=ReviewCore;
function reviewExercise(q,editable=true){
 const r=editable?reviewRecord(q):null;
 const exam=assessments.find(a=>a.id===q.sourceExamId);
 return `<article class="review-question card" data-review-id="${esc(q.id)}"><div class="review-card-head"><span class="pill">${esc(q.subject)} · ${esc(q.kind)}</span>${editable?`<span class="review-card-status">${ReviewCore.done(q,reviewState)?'✓ 已完成一次':'约'+q.minutes+'分钟'}</span>`:''}</div><h3>${esc(q.title)}</h3><p class="review-source">依据 ${esc(exam?.label||q.sourceExamId)} · 第${q.sourceQuestionIds.map(id=>esc(id.split(':q')[1])).join('、')}题${q.kind==='自编变式'?'的方法':''}</p><div class="review-material">${esc(q.material)}</div><p class="review-prompt">${esc(q.prompt)}</p>${editable?`<label class="review-answer-label">我的思路（选填，也可以在纸上作答）<textarea class="review-answer" maxlength="5000" placeholder="写下关键一步，或先在纸上完成。">${esc(r.answer)}</textarea></label>`:''}<details class="review-hint"><summary>需要时，看一点提示</summary><p>${esc(q.hint)}</p></details><details class="review-reference"><summary>试过后，再看参考思路与自查要点</summary><p>${esc(q.answer)}</p><ul>${q.checkpoints.map(t=>`<li>${esc(t)}</li>`).join('')}</ul><p class="note">${esc(q.answerBasis)}</p></details>${editable?`<div class="review-check"><label>这次做到哪一步？<select class="review-result" aria-label="${esc(q.subject)}复盘结果"><option value="">请选择，不会自动判分</option><option value="independent" ${r.result==='independent'?'selected':''}>已独立完成并自查</option><option value="with-help" ${r.result==='with-help'?'selected':''}>看提示后完成并理解</option><option value="needs-help" ${r.result==='needs-help'?'selected':''}>还需要帮助，暂未完成</option></select></label><button class="review-complete ${ReviewCore.done(q,reviewState)?'':'primary'}" ${!ReviewCore.done(q,reviewState)&&!['independent','with-help'].includes(r.result)?'disabled':''}>${ReviewCore.done(q,reviewState)?'重新复盘这题':'记录为已完成'}</button></div>`:''}</article>`;
}
let archiveSubject='全部';
$('archive-batch').innerHTML='<option value="all">全部批次</option>'+DATA.reviewBank.batches.slice().reverse().map(b=>`<option value="${esc(b.id)}">${esc(b.date)} · ${esc(b.title)}</option>`).join('');
function renderArchive(){
 const bank=DATA.reviewBank,batchId=$('archive-batch').value,query=$('archive-search').value.trim().toLocaleLowerCase();
 const selectedBatches=bank.batches.filter(b=>batchId==='all'||b.id===batchId),ids=new Set(selectedBatches.flatMap(b=>b.questionIds));
 const pool=bank.items.filter(q=>q.status==='active'&&ids.has(q.id));
 $('archive-subjects').innerHTML=['全部',...names].map(s=>`<button data-subject="${esc(s)}" aria-pressed="${s===archiveSubject}">${esc(s)} ${pool.filter(q=>s==='全部'||q.subject===s).length}</button>`).join('');
 $('archive-subjects').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{archiveSubject=b.dataset.subject;renderArchive();}));
 const list=pool.filter(q=>(archiveSubject==='全部'||q.subject===archiveSubject)&&(!query||[q.title,q.subject,q.material,q.prompt,...q.checkpoints].join(' ').toLocaleLowerCase().includes(query))).sort((a,b)=>names.indexOf(a.subject)-names.indexOf(b.subject)||a.createdAt.localeCompare(b.createdAt));
 $('archive-count').textContent=`${archiveSubject==='全部'?'六科学科归档':archiveSubject+'归档'} · ${list.length}道题${query?' · 搜索：'+$('archive-search').value.trim():''}`;
 $('archive-list').innerHTML=list.length?list.map(q=>reviewExercise(q,false)).join(''):`<div class="review-archive-empty"><h3>${query?'暂无匹配的题目':'这一科暂未整理复盘题'}</h3><p>${esc(query?'可以更换搜索词或学科。':selectedBatches.map(b=>b.subjectNotes?.[archiveSubject]).filter(Boolean).join(' ')||'材料不足时先留空；补充具体题干后再整理。')}</p></div>`;
}
$('archive-batch').addEventListener('change',renderArchive);$('archive-search').addEventListener('input',renderArchive);renderArchive();
</script></body></html>
