"语文", "title": "诗歌鉴赏：先用词句核对情感", "sourceExamId": "a-20260930-chinese", "sourceQuestionIds": ["a-20260930-chinese:q10–11"], "kind": "原题改编", "material": "杜甫《月》节选：\n天上秋期近，人间月影清。\n只益丹心苦，能添白发明。\n干戈知满地，休照国西营。\n原卷注释：诗写于安史之乱中，诗人身陷贼中，与家人远隔；“国西营”指抗击安史叛军的军队。", "prompt": "有人把这几句的意境概括为“雄浑壮阔”。你赞同吗？请结合两处具体词句，用2—3句话说明情感。", "hint": "先圈出“苦”“白发”“干戈”等词，再联系注释。判断概括是否贴合文本，不从诗人名气套结论。", "answer": "不赞同。“丹心苦”“白发”呈现忧愁与衰老感；“干戈满地”联系战乱背景，“休照国西营”寄托对征战将士的关切。整体更宜理解为忧时伤乱、沉郁悲苦，不能仅因有战争词语就归为雄浑壮阔。其他有文本依据的表达也可。", "checkpoints": ["明确判断，并指出“雄浑壮阔”与文本情感不贴合", "至少引用两处词句或注释，解释它们如何支撑情感判断"], "minutes": 5, "status": "active", "answerBasis": "按已核对题干独立整理的参考思路，非已取得的教师标准答案", "createdAt": "2026-10-20", "aiGenerated": true, "questionOrigin": "ai-adapted", "sourceNote": "依据提供的原卷材料由AI改编；不是原卷题干的逐字转录，也不标作已核实的外部真题。"}, {"id": "review-math-20261015-reflection-original", "revision": 1, "subject": "数学", "title": "光线反射：先确定直线经过的点", "sourceExamId": "a-20261015-math", "sourceQuestionIds": ["a-20261015-math:q11"], "kind": "原题重做", "material": "一束光线从点(2,3)射出，经x轴反射后，反射光线所在直线与2x＋4y－3＝0垂直。", "prompt": "求反射光线所在直线的方程。先画图并标出发光点关于x轴的对称点，再写出斜率及方程。", "hint": "把反射前的光路关于x轴对称：反射线经过发光点的对称点(2,−3)，不要求经过原发光点。", "answer": "已知直线斜率为−1/2，故反射线斜率为2。发光点关于x轴的对称点为(2,−3)，反射线过此点，所以y＋3＝2(x−2)，即2x−y−7＝0。反射点是(7/2,0)，可用作检查。", "checkpoints": ["标出对称点(2,−3)", "由垂直关系得到斜率2", "列出并化为2x−y−7＝0，检查代入成立"], "minutes": 5, "status": "active", "answerBasis": "按已核对题干独立整理的参考思路，非已取得的教师标准答案", "createdAt": "2026-10-20", "aiGenerated": false, "questionOrigin": "original-paper", "sourceNote": "原卷题干或原文节选重做；提示与自查说明由AI整理。"}, {"id": "review-history-20260922-document", "revision": 1, "subject": "历史", "title": "材料辨析：哪一结论最有证据？", "sourceExamId": "a-20260922-history", "sourceQuestionIds": ["a-20260922-history:q4"], "kind": "原题改编", "material": "原题引用《睡虎地秦墓竹简》。按原题内容整理为：\n①事务请示须用书面，不得口头请示或托人口头请示。\n②文书传送区分急件等情况，并规定时限，不得滞留。\n③伪造文书受到处罚。", "prompt": "哪一结论最受材料直接支持？\nA. 文书管理有制度性规范\nB. 所有官员都严格守法\nC. 全国百姓都能书面参政\nD. 后世制度完全照搬秦朝\n选出一项，并写两条材料依据。", "hint": "先逐项问：材料有没有写到“所有官员”“全国百姓”或“后世”？区分制度规定与实际执行结果。", "answer": "选A。书面请示、传送时限和伪造处罚说明管理有相应规则。可从中任选两条作为依据。材料有处罚规定，不代表所有人都遵守；也没有给出百姓参政或后世制度的信息。", "checkpoints": ["选择A", "至少把两条具体规定对应到“制度规范”", "不把制度要求直接写成普遍执行结果"], "minutes": 5, "status": "active", "answerBasis": "按已核对题干独立整理的参考思路，非已取得的教师标准答案", "createdAt": "2026-10-20", "aiGenerated": true, "questionOrigin": "ai-adapted", "sourceNote": "依据提供的原卷材料由AI改编；不是原卷题干的逐字转录，也不标作已核实的外部真题。"}, {"id": "review-cn-20261016-vocabulary", "revision": 1, "subject": "语文", "title": "文言词义：把字放回句子", "sourceExamId": "a-20261016-chinese", "sourceQuestionIds": ["a-20261016-chinese:q6"], "kind": "原题改编", "material": "①今人乍见孺子将入于井。\n②恻隐之心，仁之端也。\n两句均出自本次早读练习所涉《孟子》材料。", "prompt": "分别解释“乍”和“端”。“乍”在这里解释成“刚刚”是否准确？请把第①句译成现代汉语，检查句意。", "hint": "第①句说的是突然看见一个孩子将要掉进井里的情境；第②句谈一种品德的发端。", "answer": "“乍”是突然；“端”是开端、萌芽。第①句可译为：假如现在有人突然看见一个小孩将要掉进井里。“刚刚”侧重事情发生不久，不能准确表达这里突然遇见该情境的意思。译法可不同，关键词和句意应准确。", "checkpoints": ["“乍”解释为突然", "“端”解释为开端或萌芽", "译文保留“将要”和突然看到的情境"], "minutes": 5, "status": "active", "answerBasis": "按已核对题干独立整理的参考思路，非已取得的教师标准答案", "createdAt": "2026-10-20", "aiGenerated": true, "questionOrigin": "ai-adapted", "sourceNote": "依据提供的原卷材料由AI改编；不是原卷题干的逐字转录，也不标作已核实的外部真题。"}, {"id": "review-math-20261015-reflection-transfer", "revision": 1, "subject": "数学", "title": "同方法变式：换一个发光点", "sourceExamId": "a-20261015-math", "sourceQuestionIds": ["a-20261015-math:q11"], "kind": "自编变式", "material": "这是依据第11题方法自编的变式，不是原卷试题。\n光线从点(1,2)射出，经x轴反射后，反射线与直线x＋y＝0垂直。", "prompt": "求反射光线所在直线的方程，并写出它与x轴的交点。最后用一句话说明为什么不能直接用原发光点列反射线。", "hint": "先求点(1,2)关于x轴的对称点，再求与斜率−1垂直的直线斜率。", "answer": "对称点为(1,−2)，反射线斜率为1，故y＋2＝x−1，即x−y−3＝0；与x轴交于(3,0)。把入射路径关于x轴对称后，它与反射路径共线，所以反射线用对称点确定，不能直接要求反射线经过原发光点。", "checkpoints": ["对称点(1,−2)和斜率1", "方程x−y−3＝0，反射点(3,0)", "能解释选对称点的原因，而非只背结论"], "minutes": 5, "status": "active", "answerBasis": "按已核对题干独立整理的参考思路，非已取得的教师标准答案", "createdAt": "2026-10-20", "aiGenerated": true, "questionOrigin": "ai-generated", "sourceNote": "依据提供的原卷材料由AI自编变式；不是原卷题干的逐字转录，也不标作已核实的外部真题。"}, {"id": "review-history-20260922-government", "revision": 1, "subject": "历史", "ti
